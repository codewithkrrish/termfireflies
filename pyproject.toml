[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "termfireflies"
version = "1.0.0"
description = "Fireflies drifting, blinking and swarming in your terminal"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Krrish", email = "codewithkrrish7@gmail.com" }]
keywords = ["terminal", "screensaver", "fireflies", "cli", "ansi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Terminals",
]
dependencies = []

[project.scripts]
termfireflies = "termfireflies.cli:main"

[project.urls]
Homepage = "https://github.com/codewithkrrish/termfireflies"

[tool.setuptools.packages.find]
include = ["termfireflies*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
